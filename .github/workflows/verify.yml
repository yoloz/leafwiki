name: Verify

on:
  pull_request:
    branches:
      - main
      - release/*
      - releases/*
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Small repository checks; `make verify` runs the same locally.
  verify:
    name: Repository checks (make verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Run make verify
        run: make verify
