name: Release

# Build multi-platform binaries and publish a GitHub Release when a version tag
# (v*.*.*) is pushed. Uses the automatic GITHUB_TOKEN — no external secrets.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `make release` cross-compiles every platform inside the Docker builder
      # image (Go + Node bundled there), so no Go/Node setup is needed here.
      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          make release VERSION="$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: LeafWiki ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            releases/leafwiki-${{ github.ref_name }}-linux-amd64
            releases/leafwiki-${{ github.ref_name }}-linux-amd64.sha256
            releases/leafwiki-${{ github.ref_name }}-linux-arm64
            releases/leafwiki-${{ github.ref_name }}-linux-arm64.sha256
            releases/leafwiki-${{ github.ref_name }}-windows-amd64.exe
            releases/leafwiki-${{ github.ref_name }}-windows-amd64.exe.sha256
            releases/leafwiki-${{ github.ref_name }}-darwin-amd64
            releases/leafwiki-${{ github.ref_name }}-darwin-amd64.sha256
            releases/leafwiki-${{ github.ref_name }}-darwin-arm64
            releases/leafwiki-${{ github.ref_name }}-darwin-arm64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
