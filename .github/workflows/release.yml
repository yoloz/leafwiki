name: Release

# Build multi-platform binaries and publish a GitHub Release when a version tag
# (v*.*.*) is pushed. Uses the automatic GITHUB_TOKEN — no external secrets.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the release and upload assets
  id-token: write   # required by actions/attest-build-provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Make release binaries
        run: |
          VERSION=${GITHUB_REF##*/}  # extract tag like v0.1.0 or branch name
          echo "Using version: $VERSION"
          make release VERSION=$VERSION

      - name: Verify release checksums
        # Users download binary + .sha256 into one directory and run
        # `sha256sum -c`; the files must name the bare binary, no dir prefix.
        working-directory: releases
        run: sha256sum -c *.sha256

      - name: Attest release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'releases/leafwiki-${{ github.ref_name }}-*'

      - name: Get latest tag before current one
        id: latest
        run: |
          TAGS=$(git tag --sort=-v:refname)
          echo "Available tags: $TAGS"
          CURRENT="${{ github.ref_name }}"
          PREVIOUS=""
          for tag in $TAGS; do
            if [ "$tag" = "$CURRENT" ]; then continue; fi
            PREVIOUS=$tag
            break
          done
          echo "Found previous tag: $PREVIOUS"
          echo "tag=$PREVIOUS" >> $GITHUB_OUTPUT

      - name: Generate categorized changelog
        id: changelog
        run: |
          make changelog PREVIOUS=${{ steps.latest.outputs.tag }} CURRENT=${{ github.ref_name }}
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat current_release_changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: LeafWiki ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            releases/leafwiki-${{ github.ref_name }}-linux-amd64
            releases/leafwiki-${{ github.ref_name }}-linux-amd64.sha256
            releases/leafwiki-${{ github.ref_name }}-linux-386
            releases/leafwiki-${{ github.ref_name }}-linux-386.sha256
            releases/leafwiki-${{ github.ref_name }}-linux-arm64
            releases/leafwiki-${{ github.ref_name }}-linux-arm64.sha256
            releases/leafwiki-${{ github.ref_name }}-windows-amd64.exe
            releases/leafwiki-${{ github.ref_name }}-windows-amd64.exe.sha256
            releases/leafwiki-${{ github.ref_name }}-darwin-amd64
            releases/leafwiki-${{ github.ref_name }}-darwin-amd64.sha256
            releases/leafwiki-${{ github.ref_name }}-darwin-arm64
            releases/leafwiki-${{ github.ref_name }}-darwin-arm64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
